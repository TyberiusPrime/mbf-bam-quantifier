[input]
    bam = "input.bam"
	correct_reads_for_clipping = false # starsolo doesn't, so we don't either.

[input.source]
   mode ="gtf"
   filename = "input.gtf"
   id_attribute = "contig_id"
   feature = 'contig'

[cell_barcodes]
	extract = {mode = "Tag", tag = 'CB'}
    separator_char = '_'
	max_hamming = 0
    allowlist_mode = "PerRead"

[umi]
	extract = { mode = 'Tag', tag = 'UB'}
	strategy.kind = "unique"
    bucket = 'PerRegion'

[strategy]
	multi_region = 'count_both'
	overlap ='intersection_strict'
	direction = 'Forward'


[output]
    directory = 'quant'
    write_annotated_bam = false
