[input]
    bam = "input.bam"
	correct_reads_for_clipping = false # starsolo doesn't, so we don't either.

[input.source]
   mode ="bam_references"

[[filter]]
	mode = "min_aligned_length"
	threshold =  51
    action = 'keep_only'

[strategy]
	multi_region = 'count_both'
	overlap ='intersection_strict'
	direction = 'Forward'


[output]
    directory = 'quant'
    write_annotated_bam = true
