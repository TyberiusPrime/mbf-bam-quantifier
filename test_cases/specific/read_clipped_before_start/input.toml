[input]
    bam = "input.bam"
	correct_reads_for_clipping = true #

[input.source]
   mode ="bam_references"

[cell_barcodes]
	extract = {mode = "Tag", tag = 'CB'}
    separator_char = '_'
	max_hamming = 0

[umi]
	extract = { mode = 'Tag', tag = 'UB'}
	mode = "unique"
	bucket = "PerPosition"

[strategy]
	multi_region = 'count_both'
	overlap ='intersection_strict'
	direction = 'Forward'

[output]
    directory = 'output'
    write_annotated_bam = true
